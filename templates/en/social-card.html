<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/css/style.css?v=english-motion-2" />
    <style>
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        padding: 58px 62px;
        position: relative;
      }
      .og-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 55px;
        align-items: center;
        margin-top: 44px;
      }
      .og-title {
        font-size: 57px;
        line-height: 1.1;
        letter-spacing: -2.2px;
      }
      .og-title .pixel {
        display: inline-block;
        font-size: 76px;
        background: #70daec;
        line-height: 1;
        margin-top: 10px;
      }
      .og-copy {
        font-size: 17px;
        line-height: 1.7;
        margin-top: 24px;
        max-width: 450px;
      }
      .journey {
        width: 520px;
        height: 500px;
        margin-top: -44px;
        transform: scale(0.88);
        transform-origin: top left;
      }
      .window--configure {
        top: 169px;
      }
      .window--search {
        bottom: auto;
        height: 146px;
      }
      .window--enquiry {
        top: 378px;
      }
      .og-meta {
        position: absolute;
        bottom: 29px;
        left: 62px;
        font: 11px var(--mono);
      }
      .brand {
        font-size: 25px;
      }
    </style>
  </head>
  <body>
    <svg
      class="svg-library"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <defs>
        <symbol id="cloud" viewBox="0 0 32 26">
          <path
            d="M9 2h14v4h4v4h4v12H1V10h4V6h4Z"
            fill="currentColor"
            stroke="#202824"
            stroke-width="2"
          />
          <path
            d="M10 12v4m12-4v4m-9 2h6"
            fill="none"
            stroke="#202824"
            stroke-width="2"
          />
        </symbol>
        <symbol id="spark" viewBox="0 0 24 24">
          <path
            d="M10 0h4v7h3v3h7v4h-7v3h-3v7h-4v-7H7v-3H0v-4h7V7h3Z"
            fill="currentColor"
          />
        </symbol>
        <symbol id="arrow" viewBox="0 0 24 24">
          <path
            d="M3 12h17M13 5l7 7-7 7"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
        </symbol>
      </defs>
    </svg>
    <div class="brand">
      <svg class="brand__icon"><use href="#cloud" /></svg><span>NimbusIT.</span>
    </div>
    <div class="og-grid">
      <div>
        <h1 class="og-title">
          Websites that <br />help you win<br /><span class="pixel"
            >new work.</span
          >
        </h1>
        <p class="og-copy">
          Websites, ads and sales automation<br />for small businesses.
        </p>
      </div>
      <figure class="journey" aria-labelledby="journey-caption">
        <div class="journey__grid" aria-hidden="true"></div>
        <div class="window window--search">
          <div class="window__bar">
            <span class="window__dots" aria-hidden="true"
              ><i></i><i></i><i></i></span
            ><span>01 / SOMEONE FINDS YOU</span
            ><span aria-hidden="true">↗</span>
          </div>
          <div class="search-line">
            <span aria-hidden="true">⌕</span> pergola for my patio<span
              class="search-line__cursor"
              aria-hidden="true"
            ></span>
          </div>
          <div class="search-tags">
            <span>SEO &amp; content</span><span>Google / Meta ads</span>
          </div>
        </div>
        <div class="window window--configure">
          <div class="window__bar">
            <span class="window__dots" aria-hidden="true"
              ><i></i><i></i><i></i></span
            ><span>02 / THEY EXPLORE THE OPTIONS</span>
          </div>
          <div class="configure__body">
            <div class="pergola-drawing" aria-hidden="true">
              <svg
                viewBox="0 0 270 180"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linejoin="round"
              >
                <path d="m32 63 145-39 69 32-145 40Z" fill="#baf0e1" />
                <path
                  d="M32 63v75l8 4V67m61 29v65l8 4V94m137-38v75l-8 3V59M53 57l69 33m-48-39 69 33m-48-39 69 33m-48-39 69 33m-48-39 69 33m-48-39 69 33M32 71l69 33 145-40"
                />
                <path d="m40 151 51 24m27-5 115-31" stroke-dasharray="3 5" />
                <path d="M169 112h26v17h-26Z" fill="#e8dcff" />
                <path d="M174 120h16" /></svg
              ><span>YOUR PRODUCT. THEIR CHOICES.</span>
            </div>
            <div class="config-options">
              <p class="eyebrow">BUILD YOUR PERGOLA</p>
              <div><span>Size</span><b>4 × 3 m</b></div>
              <div>
                <span>Colour</span
                ><b
                  ><i class="color-swatch" aria-hidden="true"></i> Anthracite</b
                >
              </div>
              <div>
                <span>Extras</span
                ><b>LED lighting <span aria-hidden="true">✓</span></b>
              </div>
            </div>
          </div>
        </div>
        <div class="window window--enquiry">
          <div class="window__bar">
            <span class="status-dot" aria-hidden="true"></span
            ><span>03 / AN ENQUIRY WITH THE DETAILS</span
            ><span aria-hidden="true">✉</span>
          </div>
          <div class="enquiry__body">
            <span class="enquiry__check" aria-hidden="true">✓</span>
            <div>
              <strong>I’d like a quote for this pergola.</strong>
              <p>Size, options and contact details, all together.</p>
            </div>
          </div>
          <div class="enquiry__footer">
            Next: prepare a quote
            <span aria-hidden="true">↗</span>
          </div>
        </div>
        <span class="journey__sticker pixel" aria-hidden="true"
          >click.<br />connected!</span
        >
      </figure>
    </div>
    <span class="og-meta">nimbusit.hr / Antonio Lovrić</span>
  </body>
</html>
