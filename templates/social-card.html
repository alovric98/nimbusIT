<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="{{CSS_URL}}" />
    <title>NimbusIT — share image</title>
  </head>
  <body class="social-card">
    {{SYMBOLS}}
    <div class="brand">
      <svg class="brand__icon"><use href="#cloud" /></svg><span>NimbusIT.</span>
    </div>
    <div class="social-cloud">
      <svg viewBox="0 0 240 110"><use href="#n-cloud" /></svg>
    </div>
    <div class="social-copy">
      <h1>
        {{HERO_TITLE_1}}<br /><span class="paint-underline"
          >{{HERO_TITLE_2}}</span
        >
      </h1>
      <p>{{HERO_EYEBROW}}</p>
    </div>
    <div class="social-scene">{{WORLD_HERO}}</div>
  </body>
</html>
