<div class="analysis-form-shell window" data-form-shell>
  <div class="window__bar">BESPLATNA ANALIZA / BEZ OBVEZE</div>
  <form
    class="analysis-form"
    data-inquiry-form
    data-kind="analysis"
    action="https://api.web3forms.com/submit"
    method="POST"
  >
    <input
      type="hidden"
      name="access_key"
      value="8b7d9ac5-07d2-4f70-93ae-f1bced614d06"
    /><input
      type="hidden"
      name="subject"
      value="Besplatna analiza — NimbusIT"
    /><input type="hidden" name="from_name" value="nimbusit.hr" />
    <div class="honeypot" aria-hidden="true">
      <label for="analysis-bot">Ostavite prazno</label
      ><input
        id="analysis-bot"
        name="botcheck"
        type="text"
        tabindex="-1"
        autocomplete="off"
      />
    </div>
    <div class="field">
      <label for="analysis-url">Adresa Vaše stranice *</label
      ><input
        id="analysis-url"
        name="website"
        type="url"
        inputmode="url"
        autocomplete="url"
        autocapitalize="none"
        spellcheck="false"
        required
        maxlength="500"
        placeholder="vas-obrt.hr"
        aria-describedby="analysis-url-help analysis-url-error"
      />
      <p id="analysis-url-help" class="field-help">
        Možete upisati i bez https://.
      </p>
      <p class="field-error" id="analysis-url-error" hidden></p>
    </div>
    <div class="field">
      <label for="analysis-contact">E-mail ili telefon *</label
      ><input
        id="analysis-contact"
        name="contact"
        type="text"
        autocomplete="email"
        autocapitalize="none"
        required
        maxlength="200"
        aria-describedby="analysis-contact-error"
      />
      <p class="field-error" id="analysis-contact-error" hidden></p>
    </div>
    {{OPTIONAL_NAME}}
    <p class="form-privacy">
      Podatke koristim za odgovor i dogovor analize. Obrazac šalje Web3Forms.
      <a href="/privatnost/">Privatnost</a>
    </p>
    <button class="button button--cyan form-submit" type="submit">
      Zatražite besplatnu analizu <span aria-hidden="true">↗</span>
    </button>
    <p class="form-status" role="status" aria-live="polite" hidden></p>
    <noscript
      ><p>
        Upišite punu adresu s https://. Slanje otvara Web3Forms. Možete i pisati
        na <a href="mailto:{{EMAIL}}">{{EMAIL}}</a>.
      </p></noscript
    >
  </form>
  <div class="form-success" tabindex="-1" hidden>
    <span class="success-icon pixel" aria-hidden="true">✓</span>
    <h3>Zahtjev je poslan.</h3>
    <p>
      Servis je potvrdio primitak. Javit ću Vam se na kontakt koji ste naveli
      radi dogovora analize.
    </p>
    <button class="button button--white" type="button" data-form-reset>
      Pošaljite novi zahtjev ↗
    </button>
  </div>
</div>
