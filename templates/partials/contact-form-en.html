<form
  id="kontakt-obrazac"
  action="https://api.web3forms.com/submit"
  method="POST"
>
  <!-- Public client-side Web3Forms access key retained from the repository. Not a secret. -->
  <input
    type="hidden"
    name="access_key"
    value="8b7d9ac5-07d2-4f70-93ae-f1bced614d06"
  />
  <input type="hidden" name="subject" value="New project enquiry — NimbusIT" />
  <input type="hidden" name="from_name" value="nimbusit.hr" />
  <input type="hidden" name="paket" id="paket" value="General enquiry" />
  <div class="honeypot" aria-hidden="true">
    <label for="botcheck">Leave this field blank</label
    ><input
      id="botcheck"
      type="text"
      name="botcheck"
      tabindex="-1"
      autocomplete="off"
    />
  </div>
  <p class="form-intro">Fields marked with * are required.</p>
  <div id="odabrani-paket" class="selected-package" hidden>
    <span></span
    ><button type="button" aria-label="Remove selected package">×</button>
  </div>
  <div class="form-row">
    <div class="field">
      <label for="ime">Name *</label
      ><input
        id="ime"
        name="name"
        autocomplete="name"
        required
        maxlength="100"
        aria-describedby="ime-greska"
      />
      <p class="field-error" id="ime-greska" hidden></p>
    </div>
    <div class="field">
      <label for="email">E-mail *</label
      ><input
        id="email"
        type="email"
        inputmode="email"
        autocapitalize="none"
        spellcheck="false"
        name="email"
        autocomplete="email"
        required
        maxlength="200"
        aria-describedby="email-greska"
      />
      <p class="field-error" id="email-greska" hidden></p>
    </div>
  </div>
  <div class="field">
    <label for="tvrtka">Business or website <span>(optional)</span></label
    ><input
      id="tvrtka"
      name="business"
      autocomplete="organization"
      maxlength="250"
    />
  </div>
  <div class="field">
    <label for="poruka">About your project *</label
    ><textarea
      id="poruka"
      name="message"
      rows="4"
      required
      maxlength="5000"
      placeholder="What do you do, what are you planning, and do you already have a website?"
      aria-describedby="poruka-greska"
    ></textarea>
    <p class="field-error" id="poruka-greska" hidden></p>
  </div>
  <p class="form-privacy">
    I use your details to reply. Read about data handling in the
    <a href="/en/privacy/">privacy policy</a>.
  </p>
  <button class="button button--cyan form-submit" type="submit">
    Send your enquiry <span aria-hidden="true">↗</span>
  </button>
  <p
    id="form-status"
    class="form-status"
    role="status"
    aria-live="polite"
    hidden
  ></p>
  <noscript
    ><p class="form-status">
      Submitting opens the form provider. You can also
      <a href="mailto:{{EMAIL}}">email me directly</a>.
    </p></noscript
  >
</form>
<div class="form-success" id="potvrda" tabindex="-1" hidden>
  <div class="alert95__bar">
    <span class="alert95__title">NimbusIT</span>
    <button
      class="alert95__close"
      type="button"
      data-form-reset
      aria-label="Close message"
    >
      <span aria-hidden="true">✕</span>
    </button>
  </div>
  <span class="success-icon pixel" aria-hidden="true">✓</span>
  <h3>Thanks for your message.</h3>
  <p>Your enquiry was sent. I’ll reply to the email address you provided.</p>
  <button class="button button--white" type="button" id="novi-upit">
    Send another enquiry <span aria-hidden="true">↗</span>
  </button>
</div>
