<div class="analysis-form-shell window" data-form-shell>
  <div class="window__bar">FREE WEBSITE REVIEW / NO OBLIGATION</div>
  <form
    class="analysis-form"
    data-inquiry-form
    data-kind="analysis"
    action="https://api.web3forms.com/submit"
    method="POST"
  >
    <input
      type="hidden"
      name="access_key"
      value="8b7d9ac5-07d2-4f70-93ae-f1bced614d06"
    /><input
      type="hidden"
      name="subject"
      value="Free website review — NimbusIT"
    /><input type="hidden" name="from_name" value="nimbusit.hr" />
    <div class="honeypot" aria-hidden="true">
      <label for="analysis-bot">Leave blank</label
      ><input
        id="analysis-bot"
        name="botcheck"
        type="text"
        tabindex="-1"
        autocomplete="off"
      />
    </div>
    <div class="field">
      <label for="analysis-url">Website address *</label
      ><input
        id="analysis-url"
        name="website"
        type="url"
        inputmode="url"
        autocomplete="url"
        autocapitalize="none"
        spellcheck="false"
        required
        maxlength="500"
        placeholder="your-business.com"
        aria-describedby="analysis-url-help analysis-url-error"
      />
      <p id="analysis-url-help" class="field-help">
        You can leave out https://.
      </p>
      <p class="field-error" id="analysis-url-error" hidden></p>
    </div>
    <div class="field">
      <label for="analysis-contact">Email or phone *</label
      ><input
        id="analysis-contact"
        name="contact"
        type="text"
        autocomplete="email"
        autocapitalize="none"
        required
        maxlength="200"
        aria-describedby="analysis-contact-error"
      />
      <p class="field-error" id="analysis-contact-error" hidden></p>
    </div>
    {{OPTIONAL_NAME}}
    <p class="form-privacy">
      I use your details to arrange the review. Read about data handling in the
      <a href="/en/privacy/">privacy policy</a>.
    </p>
    <button class="button button--cyan form-submit" type="submit">
      Request your free review <span aria-hidden="true">↗</span>
    </button>
    <p class="form-status" role="status" aria-live="polite" hidden></p>
    <noscript
      ><p>
        Enter the full address with https://. Submitting opens Web3Forms. You
        can also email
        <a href="mailto:{{EMAIL}}">{{EMAIL}}</a>.
      </p></noscript
    >
  </form>
  <div class="form-success" tabindex="-1" hidden>
    <div class="alert95__bar">
      <span class="alert95__title">NimbusIT</span>
      <button
        class="alert95__close"
        type="button"
        data-form-reset
        aria-label="Close message"
      >
        <span aria-hidden="true">✕</span>
      </button>
    </div>
    <span class="success-icon pixel" aria-hidden="true">✓</span>
    <h3>Thanks, your request was sent.</h3>
    <p>
      I’ll get in touch using the details you provided to arrange a
      conversation.
    </p>
    <button class="button button--white" type="button" data-form-reset>
      Send another request ↗
    </button>
  </div>
</div>
