<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7ef" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL}}" />
    {{HREFLANG}}
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="{{LOCALE}}" />
    <meta property="og:site_name" content="NimbusIT" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    {{PRELOADS}}
    <link rel="stylesheet" href="{{CSS_URL}}" />
    <link rel="stylesheet" href="{{LOCAL_CSS_URL}}" />
    <script src="{{MAIN_JS_URL}}" defer></script>
    <script src="{{MOTION_JS_URL}}" defer></script>
  </head>
  <body class="{{LANG}}" data-contact-email="{{EMAIL}}">
    <a class="skip-link" href="#main-content">{{SKIP}}</a
    >{{SYMBOLS}}{{HEADER}}{{BODY}}{{FOOTER}}{{SCHEMA}}
  </body>
</html>
